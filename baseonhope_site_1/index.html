<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Base on Hope | Supporting the Laos National Baseball Team</title>
<meta name="description" content="Base on Hope is a student-led club from Fayston Preparatory School of Suji supporting the Laos National Baseball Team through fundraising, sponsorships, and youth-led action.">
<meta property="og:title" content="Base on Hope">
<meta property="og:description" content="A student-led club supporting the Laos National Baseball Team.">
<meta property="og:image" content="https://baseonhope.org/images/projects/laos-meal.jpg">
<link rel="icon" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B2559; --navy-2:#13357A; --red:#CE1126; --red-soft:#FCE8EA;
  --ink:#121826; --muted:#5B6475; --line:#E3E7EE; --bg:#FFFFFF; --bg-2:#F5F7FB;
  --radius:16px; --max:1120px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,"Noto Sans KR",system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{max-width:var(--max);margin:0 auto;padding:0 20px}
section{padding:88px 0;scroll-margin-top:64px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin-bottom:12px}
h1,h2,h3{line-height:1.2;letter-spacing:-.02em}
h2{font-size:clamp(28px,4vw,40px);font-weight:800;margin-bottom:16px;color:var(--navy)}
h3{font-size:20px;font-weight:700}
.lead{font-size:18px;color:var(--muted);max-width:680px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:999px;font-weight:600;text-decoration:none;font-size:15px;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn-red{background:var(--red);color:#fff}
.btn-ghost{border:1.5px solid rgba(255,255,255,.6);color:#fff}
.btn-navy{background:var(--navy);color:#fff}

/* header */
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;color:var(--navy);font-size:18px}
.brand img{height:36px;width:auto}
.nav ul{display:flex;gap:26px;list-style:none}
.nav ul a{text-decoration:none;font-size:14px;font-weight:500;color:var(--muted)}
.nav ul a:hover{color:var(--navy)}
.menu-btn{display:none;background:none;border:0;font-size:24px;cursor:pointer;color:var(--navy)}
@media(max-width:860px){
  .nav ul{display:none;position:absolute;top:64px;left:0;right:0;background:#fff;flex-direction:column;gap:0;border-bottom:1px solid var(--line)}
  .nav ul.open{display:flex}
  .nav ul a{display:block;padding:14px 20px}
  .menu-btn{display:block}
}

/* hero */
.hero{position:relative;color:#fff;padding:120px 0 96px;background:linear-gradient(120deg,rgba(11,37,89,.94),rgba(19,53,122,.82)),url("gallery-4.hero.webp") center/cover no-repeat}
.hero h1{font-size:clamp(36px,6vw,60px);font-weight:800;max-width:760px;margin-bottom:20px}
.hero h1 span{color:#FFB3BC}
.hero p{font-size:19px;max-width:620px;opacity:.9;margin-bottom:32px}
.hero .actions{display:flex;gap:12px;flex-wrap:wrap}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.14);margin-bottom:20px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:-48px;position:relative;z-index:2}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:0 10px 30px rgba(11,37,89,.08)}
.stat b{display:block;font-size:30px;font-weight:800;color:var(--navy);letter-spacing:-.02em}
.stat span{font-size:14px;color:var(--muted)}
@media(max-width:860px){.stats{grid-template-columns:repeat(2,1fr)}}

/* mission */
.mv{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:40px}
.mv .card{border-radius:var(--radius);padding:36px}
.mv .mission{background:var(--navy);color:#fff}
.mv .vision{background:var(--red-soft)}
.mv .label{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px;opacity:.8}
.mv .vision .label{color:var(--red);opacity:1}
.mv h3{font-size:26px;margin-bottom:12px}
.mv p{opacity:.9}
@media(max-width:760px){.mv{grid-template-columns:1fr}}

/* story */
.story{background:var(--bg-2)}
.story-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center}
.story img{border-radius:var(--radius);aspect-ratio:4/3;object-fit:cover;width:100%;background:var(--line)}
.quote{border-left:4px solid var(--red);padding:6px 0 6px 18px;margin:22px 0;font-size:18px;font-weight:500;color:var(--navy)}
@media(max-width:860px){.story-grid{grid-template-columns:1fr}}

/* founders message */
.msg{display:grid;grid-template-columns:280px 1fr;gap:48px;align-items:start}
.founders{display:flex;flex-direction:column;gap:14px}
.founder{display:flex;align-items:center;gap:14px}
.founder img{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--line)}
.founder b{display:block;font-size:15px}
.founder span{font-size:13px;color:var(--muted)}
.letter p{margin-bottom:16px;font-size:17px}
.sign{font-weight:700;color:var(--navy);margin-top:8px}
@media(max-width:760px){.msg{grid-template-columns:1fr}}

/* timeline */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:28px 0}
.filters button{border:1px solid var(--line);background:#fff;padding:8px 16px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer;color:var(--muted)}
.filters button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media(max-width:960px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
.pcard{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff;display:flex;flex-direction:column}
.pcard .ph{aspect-ratio:16/10;background:linear-gradient(135deg,var(--navy),var(--navy-2));display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.5);font-size:13px}
.pcard .ph{position:relative;overflow:hidden}.pcard .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pcard .body{padding:20px;display:flex;flex-direction:column;gap:8px;flex:1}
.meta{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--red-soft);color:var(--red)}
.amount{font-weight:700;color:var(--navy)}
.pcard a.more{margin-top:auto;font-size:14px;font-weight:600;color:var(--red);text-decoration:none}

/* documents */
.docs{background:var(--bg-2)}
.doclist{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:36px}
@media(max-width:700px){.doclist{grid-template-columns:1fr}}
.doc{display:flex;gap:16px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px;text-decoration:none}
.doc:hover{border-color:var(--navy)}
.doc .ic{flex:none;width:44px;height:44px;border-radius:10px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.doc b{display:block;margin-bottom:4px}
.doc span{font-size:14px;color:var(--muted)}
.doc .view{display:inline-block;margin-top:8px;font-size:13px;font-weight:600;color:var(--red)}
.note{font-size:13px;color:var(--muted);margin-top:18px}

/* identity */
.logos{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:36px}
.logo-card{border:1px solid var(--line);border-radius:var(--radius);padding:36px;text-align:center}
.logo-card .box{height:180px;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.logo-card .box img{max-height:170px;width:auto}
.logo-card .when{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
.logo-card p{font-size:15px;color:var(--muted);margin-top:6px}
@media(max-width:600px){.logos{grid-template-columns:1fr}}

/* partners */
.partners{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:36px}
@media(max-width:860px){.partners{grid-template-columns:repeat(2,1fr)}}
.partner{border:1px solid var(--line);border-radius:var(--radius);padding:22px;text-align:center;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.partner img{max-height:48px;width:auto}
.partner b{font-size:15px}
.partner span{font-size:12px;color:var(--muted)}

/* support */
.support{background:var(--navy);color:#fff}
.support h2{color:#fff}
.support .lead{color:rgba(255,255,255,.8)}
.ways{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:36px 0}
@media(max-width:860px){.ways{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.ways{grid-template-columns:1fr}}
.way{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:var(--radius);padding:24px}
.way h3{font-size:17px;margin-bottom:6px}
.way p{font-size:14px;opacity:.8}

/* faq */
details{border-bottom:1px solid var(--line);padding:18px 0}
summary{cursor:pointer;font-weight:600;font-size:17px;list-style:none;display:flex;justify-content:space-between}
summary::after{content:"+";color:var(--red);font-size:22px;line-height:1}
details[open] summary::after{content:"–"}
details p{color:var(--muted);margin-top:10px}

footer{background:#081A40;color:rgba(255,255,255,.7);padding:48px 0;font-size:14px}
.foot{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}
footer a{color:#fff}
.disclaimer{margin-top:24px;font-size:12px;opacity:.7}

/* lang toggle */
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-left:16px}
.lang button{border:0;background:#fff;font:inherit;font-size:13px;font-weight:600;padding:6px 12px;cursor:pointer;color:var(--muted)}
.lang button.on{background:var(--navy);color:#fff}
.nav-right{display:flex;align-items:center}
html[lang=ko] body{word-break:keep-all}
/* members */
.teams{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:36px}
@media(max-width:860px){.teams{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.teams{grid-template-columns:1fr}}
.team{border:1px solid var(--line);border-radius:var(--radius);padding:24px;background:#fff}
.team h3{font-size:16px;color:var(--navy);display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.team h3 small{font-size:12px;font-weight:600;color:var(--red);background:var(--red-soft);padding:2px 10px;border-radius:999px}
.team ul{list-style:none;display:flex;flex-direction:column;gap:10px}
.team li{display:flex;align-items:center;gap:12px;font-size:15px}
.av{flex:none;width:34px;height:34px;border-radius:50%;background:var(--bg-2);color:var(--navy);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.team li span{font-size:12px;color:var(--muted);display:block;line-height:1.2}
/* v2 additions */
.serif{font-family:"Cormorant Garamond","Noto Serif KR",Georgia,serif}
.letter-wrap{display:grid;grid-template-columns:1fr 1.15fr;gap:56px;align-items:start}
@media(max-width:900px){.letter-wrap{grid-template-columns:1fr}}
.letter-photo img{border-radius:var(--radius);width:100%;object-fit:cover}
.letter-photo figcaption{font-size:13px;color:var(--muted);margin-top:10px;text-align:center}
.letter-card{background:#FBF8F2;border:1px solid #EFE6D6;border-radius:var(--radius);padding:44px 44px 36px}
@media(max-width:600px){.letter-card{padding:28px 22px}}
.letter-card h3{font-family:"Cormorant Garamond","Noto Serif KR",serif;font-size:32px;font-weight:600;color:var(--navy);margin-bottom:18px}
.letter-card p{font-family:"Cormorant Garamond","Noto Serif KR",serif;font-size:19px;line-height:1.75;color:#2a2f3a;margin-bottom:14px}
html[lang=ko] .letter-card p{font-size:16px;line-height:1.9}
.letter-card .pull{font-size:24px;font-style:italic;color:var(--red);border-left:3px solid var(--red);padding-left:16px;margin:24px 0}
html[lang=ko] .letter-card .pull{font-size:19px;font-style:normal}
.letter-card .sig{margin-top:22px;font-weight:600;color:var(--navy)}
.letter-card .sig small{display:block;font-family:Inter,"Noto Sans KR",sans-serif;font-size:13px;color:var(--muted);font-weight:500;margin-top:4px}
.goals{list-style:none;display:flex;flex-direction:column;gap:10px;margin-top:14px}
.goals li{display:flex;gap:10px;opacity:.92}
.goals li b{flex:none;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:12px}
.lead-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:36px}
@media(max-width:760px){.lead-row{grid-template-columns:1fr}}
.lead-card{background:var(--navy);color:#fff;border-radius:var(--radius);padding:22px 24px}
.lead-card span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.lead-card b{display:block;font-size:19px;margin-top:4px}
.depts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
@media(max-width:900px){.depts{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.depts{grid-template-columns:1fr}}
.dept{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px}
.dept .dn{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
.dept b{display:block;font-size:17px;margin:6px 0 8px;color:var(--navy)}
.dept ul{list-style:none;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.dept li::before{content:"· ";color:var(--red)}
.status{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:#FFF4D6;color:#8A5A00;margin-left:6px}
.video-wrap{display:grid;grid-template-columns:320px 1fr;gap:40px;align-items:center;margin-top:48px}
@media(max-width:760px){.video-wrap{grid-template-columns:1fr}}
.video-wrap video{width:100%;border-radius:var(--radius);background:#000;aspect-ratio:9/16;object-fit:cover}
.credit{font-size:12px;color:var(--muted);margin-top:8px}
.gallery{columns:4 220px;column-gap:14px;margin-top:32px}
.gallery img{width:100%;border-radius:12px;margin-bottom:14px;break-inside:avoid}
table.ledger{width:100%;border-collapse:collapse;margin-top:28px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;font-size:15px}
.ledger th,.ledger td{padding:14px 18px;text-align:left;border-bottom:1px solid var(--line)}
.ledger th{background:var(--bg-2);font-size:13px;color:var(--muted);font-weight:600}
.ledger td.num,.ledger th.num{text-align:right;font-variant-numeric:tabular-nums}
.ledger tfoot td{font-weight:700;color:var(--navy);border-bottom:0}
.ledger-wrap{overflow-x:auto}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="brand" href="#top"><img src="images/logo.png" alt="" onerror="this.onerror=null;this.src='images/logo-interim.jpg'">Base on Hope</a>
    <div class="nav-right">
      <button class="menu-btn" aria-label="Menu" onclick="document.getElementById('menu').classList.toggle('open')">☰</button>
      <ul id="menu" onclick="this.classList.remove('open')">
        <li><a href="#mission" data-i18n="nav.mission"></a></li>
        <li><a href="#story" data-i18n="nav.story"></a></li>
        <li><a href="#message" data-i18n="nav.founders"></a></li>
        <li><a href="#leadership" data-i18n="nav.members"></a></li>
        <li><a href="#projects" data-i18n="nav.projects"></a></li>
        <li><a href="#transparency" data-i18n="nav.transparency"></a></li>
        <li><a href="#partners" data-i18n="nav.partners"></a></li>
        <li><a href="#support" data-i18n="nav.support"></a></li>
      </ul>
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="en">EN</button><button data-lang="ko">KO</button>
      </div>
    </div>
  </div>
</header>

<main id="top">

<section class="hero" style="background:linear-gradient(120deg,rgba(11,37,89,.94),rgba(19,53,122,.80)),url('images/projects/laos-meal.jpg') center 30%/cover no-repeat">
  <div class="wrap">
    <span class="tag" data-i18n="hero.tag"></span>
    <h1 data-i18n-html="hero.title"></h1>
    <p data-i18n="hero.text"></p>
    <div class="actions">
      <a class="btn btn-red" href="#support" data-i18n="hero.btn1"></a>
      <a class="btn btn-ghost" href="#projects" data-i18n="hero.btn2"></a>
    </div>
  </div>
</section>

<div class="wrap"><div class="stats" id="stats"></div></div>

<section id="mission">
  <div class="wrap">
    <div class="eyebrow" data-i18n="mv.eyebrow"></div>
    <h2 data-i18n="mv.title"></h2>
    <p class="lead" data-i18n="mv.lead"></p>
    <div class="mv">
      <div class="card mission">
        <div class="label" data-i18n="mv.mLabel"></div>
        <h3 data-i18n="mv.mTitle"></h3>
        <p data-i18n="mv.mText"></p>
        <ul class="goals">
          <li><b>1</b><span data-i18n="mv.g1"></span></li>
          <li><b>2</b><span data-i18n="mv.g2"></span></li>
        </ul>
      </div>
      <div class="card vision">
        <div class="label" data-i18n="mv.vLabel"></div>
        <h3 data-i18n="mv.vTitle"></h3>
        <p data-i18n="mv.vText"></p>
      </div>
    </div>
  </div>
</section>

<section id="story" class="story">
  <div class="wrap">
    <div class="story-grid">
      <div>
        <div class="eyebrow" data-i18n="story.eyebrow"></div>
        <h2 data-i18n="story.title"></h2>
        <p data-i18n="story.p1"></p>
        <div class="quote" data-i18n="story.quote"></div>
        <p data-i18n="story.p2"></p>
      </div>
      <figure>
        <img src="images/projects/laos-meal.jpg" alt="Laos National Baseball Team players lining up for a meal" loading="lazy">
        <figcaption class="credit" data-i18n="credit.je"></figcaption>
      </figure>
    </div>
    <div class="video-wrap">
      <figure>
        <video src="images/video/laos-meal-prep.mp4" poster="images/video/laos-meal-prep-poster.jpg" autoplay muted loop playsinline controls preload="metadata"></video>
        <figcaption class="credit" data-i18n="credit.je"></figcaption>
      </figure>
      <div>
        <div class="eyebrow" data-i18n="video.eyebrow"></div>
        <h3 style="font-size:26px;color:var(--navy);margin-bottom:12px" data-i18n="video.title"></h3>
        <p style="color:var(--muted)" data-i18n="video.text"></p>
      </div>
    </div>
  </div>
</section>

<section id="message">
  <div class="wrap">
    <div class="eyebrow" data-i18n="msg.eyebrow"></div>
    <div class="letter-wrap" style="margin-top:20px">
      <figure class="letter-photo">
        <img src="images/founders/founders-jamsil.jpg" alt="The three founders of Base on Hope at Jamsil Baseball Stadium" loading="lazy">
        <figcaption id="founderCaption"></figcaption>
      </figure>
      <div class="letter-card">
        <h3 data-i18n="msg.title"></h3>
        <p data-i18n="msg.dear"></p>
        <p data-i18n="msg.p1"></p>
        <p data-i18n="msg.p2"></p>
        <p data-i18n="msg.p3"></p>
        <p data-i18n="msg.p4"></p>
        <p data-i18n="msg.p5"></p>
        <p data-i18n="msg.p6"></p>
        <p data-i18n="msg.p7"></p>
        <p class="pull" data-i18n="msg.quote"></p>
        <p class="sig"><span data-i18n="msg.with"></span><br><span data-i18n="msg.founders"></span><small id="signNames"></small></p>
      </div>
    </div>
  </div>
</section>

<section id="leadership" style="background:var(--bg-2)">
  <div class="wrap">
    <div class="eyebrow" data-i18n="lead.eyebrow"></div>
    <h2 data-i18n="lead.title"></h2>
    <p class="lead" id="leadLead"></p>
    <div class="lead-row" id="execs"></div>
    <div class="depts" id="depts"></div>
  </div>
</section>

<section id="projects">
  <div class="wrap">

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let LANG = "en";
try { LANG = localStorage.getItem("boh-lang") || ((navigator.language || "").startsWith("ko") ? "ko" : "en"); } catch(e) {}
const L = v => (v && typeof v === "object") ? (v[LANG] ?? v.en ?? "") : (v ?? "");
const T = k => I18N[LANG][k] ?? I18N.en[k] ?? k;
const won = n => "₩" + n.toLocaleString("en-US");
let current = "All";

function render(){
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = T(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-html]").forEach(el => el.innerHTML = T(el.dataset.i18nHtml));
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.lang === LANG));

  $("stats").innerHTML = SITE_DATA.stats.map(s => `<div class="stat"><b>${esc(s.value)}</b><span>${esc(L(s.label))}</span></div>`).join("");

  const fn = SITE_DATA.founders.map(f => L(f)).join(", ");
  $("founderCaption").textContent = T("msg.caption").replace("{names}", fn);
  $("signNames").textContent = fn;

  $("leadLead").textContent = T("lead.lead").replace("{n}", SITE_DATA.memberCount);
  $("execs").innerHTML = SITE_DATA.execs.map(e => `<div class="lead-card"><span>${esc(L(e.role))}</span><b>${esc(L(e.name))}</b></div>`).join("")
    + `<p style="grid-column:1/-1;font-size:14px;color:var(--muted)">${esc(L(SITE_DATA.execDuties))}</p>`;
  $("depts").innerHTML = SITE_DATA.departments.map(d => `
    <div class="dept"><div class="dn">${esc(L(d.dept))}</div><b>${esc(L(d.head))}</b>
      <ul>${d.roles.map(r => `<li>${esc(L(r))}</li>`).join("")}</ul></div>`).join("");

  const types = ["All", ...new Set(SITE_DATA.projects.map(p => p.type))];
  $("filters").innerHTML = types.map(t => `<button class="${t===current?'on':''}" data-t="${esc(t)}">${esc(T(t==="All" ? "proj.all" : "proj."+t))}</button>`).join("");
  $("filters").querySelectorAll("button").forEach(b => b.onclick = () => { current = b.dataset.t; render(); });
  $("projectGrid").innerHTML = SITE_DATA.projects.filter(p => current==="All" || p.type===current).map(p => `

      <div class="ph">${p.img ? `<img src="${esc(p.img)}" alt="${esc(L(p.title))}" loading="lazy" onerror="this.remove()">` : "Base on Hope"}</div>
      <div class="body">
        <div><span class="chip">${esc(T("proj."+p.type))}</span>${p.status && p.status!=="done" ? `<span class="status">${esc(T("status."+p.status))}</span>` : ""}</div>
        <h3>${esc(L(p.title))}</h3>
        <div class="meta">${p.date ? `<span>${esc(p.date)}</span>` : ""}<span>${esc(L(p.place))}</span></div>
        ${p.amount ? `<div class="amount">${esc(p.amount)}</div>` : ""}
        <p style="font-size:15px;color:var(--muted)">${esc(L(p.text))}</p>
        ${p.link ? `<a class="more" href="${esc(p.link)}" target="_blank" rel="noopener">${esc(T("proj.ig"))}</a>` : ""}
      </div>
    </article>`).join("");

  const tot = SITE_DATA.ledger.reduce((a, r) => a + r.amount, 0), totN = SITE_DATA.ledger.reduce((a, r) => a + r.n, 0);
  $("ledger").innerHTML = `<thead><tr><th>${esc(T("tr.event"))}</th><th class="num">${esc(T("tr.n"))}</th><th class="num">${esc(T("tr.amount"))}</th></tr></thead>
    <tbody>${SITE_DATA.ledger.map(r => `<tr><td>${esc(L(r.event))}</td><td class="num">${r.n}</td><td class="num">${won(r.amount)}</td></tr>`).join("")}</tbody>
    <tfoot><tr><td>${esc(T("tr.total"))}</td><td class="num">${totN}</td><td class="num">${won(tot)}</td></tr></tfoot>`;

  const docs = SITE_DATA.documents.filter(d => d.url);
  $("documents").style.display = docs.length ? "" : "none";
  $("docList").innerHTML = docs.map(d => `
    <a class="doc" href="${esc(d.url)}" target="_blank" rel="noopener">
      <div class="ic">DOC</div>
      <div><b>${esc(L(d.title))}</b><span>${esc(L(d.desc))}</span><br><span class="view">${esc(T("docs.view"))}</span></div>
    </a>`).join("");

  $("galleryGrid").innerHTML = SITE_DATA.gallery.map(src => `<img src="${esc(src)}" alt="" loading="lazy" onerror="this.remove()">`).join("");

  $("partnerGrid").innerHTML = SITE_DATA.partners.map(p => `
    <div class="partner">${p.img ? `<img src="${esc(p.img)}" alt="" onerror="this.remove()">` : ""}<b>${esc(L(p.name))}</b><span>${esc(L(p.note))}</span></div>`).join("");
}

document.querySelectorAll(".lang button").forEach(b => b.onclick = () => {
  LANG = b.dataset.lang; try { localStorage.setItem("boh-lang", LANG); } catch(e) {} render();
});
$("mailBtn").href = "mailto:" + SITE_DATA.email;
$("joinBtn").href = SITE_DATA.joinForm;
$("footMail").textContent = SITE_DATA.email;
$("footIg").href = SITE_DATA.instagram;
$("yr").textContent = new Date().getFullYear();
render();
</script>
</body>
</html>
