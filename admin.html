<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>사이트 편집 | Base on Hope</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    :root { --blue:#2563eb; --line:#dbe3f0; --ink:#111827; --muted:#64748b; --bg:#f7f8fb; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans Lao", "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    header, .connect {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    header { flex-wrap: wrap; }
    header strong { font-size: 18px; margin-right: 4px; }
    .page-nav, .lang-switch { display: flex; flex-wrap: wrap; gap: 6px; }
    .page-nav { flex: 1; }
    .page-nav button, .lang-switch button {
      background: #eef2ff;
      color: #1e3a8a;
      padding: 8px 10px;
      font-size: 13px;
    }
    .page-nav button.active, .lang-switch button.active { background: var(--blue); color: #fff; }
    .connect input, .editor input, .editor textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
      color: var(--ink);
      background: #fff;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      background: var(--blue);
      color: #fff;
      white-space: nowrap;
    }
    button.secondary { background: #e9eefb; color: #1d4ed8; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .connect input { max-width: 420px; }
    #status { color: var(--muted); font-size: 14px; }
    #status.ok { color: #18794e; }
    #status.error { color: #b91c1c; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 360px; min-height: 0; }
    iframe { width: 100%; height: 100%; border: 0; background: #fff; }
    .editor {
      overflow: auto;
      padding: 18px 16px 28px;
      background: #fff;
      border-left: 1px solid var(--line);
    }
    .editor h2 { margin: 0 0 6px; font-size: 18px; }
    .hint, .meta { color: var(--muted); font-size: 13px; line-height: 1.5; }
    label { display: block; margin: 14px 0 6px; font-size: 13px; font-weight: 800; }
    textarea { min-height: 88px; resize: vertical; }
    .editor .thumb { width: 100%; max-height: 180px; object-fit: contain; border-radius: 12px; background: #f1f5f9; margin-top: 10px; }
    @media (max-width: 900px) {
      .workspace { grid-template-columns: 1fr; grid-template-rows: minmax(280px, 50vh) auto; }
      .editor { border-left: 0; border-top: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <header>
    <strong>사이트 편집</strong>
    <nav id="pages" class="page-nav" aria-label="페이지 이동"></nav>
    <div class="lang-switch" role="group" aria-label="미리보기 언어">
      <button type="button" data-preview-lang="en">EN</button>
      <button type="button" data-preview-lang="ko">한국어</button>
      <button type="button" data-preview-lang="lo">ລາວ</button>
    </div>
    <button id="publish" type="button" disabled>이 페이지 저장</button>
    <a href="./">사이트로</a>
  </header>
  <div class="connect">
    <input id="token" type="password" autocomplete="off" placeholder="GitHub token (저장할 때만 필요)" />
    <button id="connect" class="secondary" type="button">연결</button>
    <span id="status">토큰 없이 이 사이트의 페이지를 먼저 불러옵니다.</span>
  </div>
  <div class="workspace">
    <iframe id="preview" title="페이지 미리보기"></iframe>
    <aside class="editor">
      <h2 id="editorTitle">요소를 클릭하세요</h2>
      <p class="hint" id="editorHint">글이나 사진을 누르면 오른쪽에서 고칠 수 있습니다. 다른 페이지로 가려면 위의 버튼을 누르세요. 메뉴는 한 덩어리로 수정합니다.</p>
      <p class="meta" id="editorMeta"></p>
      <div id="fields"></div>
    </aside>
  </div>

  <script>
    const REPO = "fpsbaseonhope/Base-on-Hope";
    const BRANCH = "main";
    const PAGES = [
      ["홈", "index.html"],
      ["라오스 국가대표팀", "about/index.html"],
      ["멤버", "members/index.html"],
      ["목표", "commitment/index.html"],
      ["프로젝트", "projects/index.html"],
      ["성과", "impact/index.html"],
      ["갤러리", "gallery/index.html"],
      ["후원", "support/index.html"],
      ["메뉴", "navbar.html"]
    ];
    const EDITOR_CSS = `
      [data-edit-id] { cursor: pointer; }
      [data-edit-id]:hover { outline: 2px solid #2563eb; outline-offset: 2px; }
      .editor-selected { outline: 2px solid #1d4ed8 !important; outline-offset: 3px; }
    `;

    const $ = (id) => document.getElementById(id);
    const pages = new Map();
    let token = "";
    let currentPath = "index.html";
    let selectedId = "";

    function setStatus(message, type) {
      const el = $("status");
      el.textContent = message;
      el.className = type || "";
    }

    async function api(path, options = {}) {
      const response = await fetch("https://api.github.com/repos/" + REPO + "/contents/" + path, {
        ...options,
        headers: {
          Accept: "application/vnd.github+json",
          Authorization: "Bearer " + token,
          "X-GitHub-Api-Version": "2022-11-28",
          ...(options.headers || {})
        }
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.message || "GitHub API error " + response.status);
      return data;
    }

    function decodeContent(base64) {
      const binary = atob(base64.replace(/\n/g, ""));
      const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    }

    function encodeContent(value) {
      const bytes = new TextEncoder().encode(value);
      let binary = "";
      const chunk = 0x8000;
      for (let index = 0; index < bytes.length; index += chunk) {
        binary += String.fromCharCode(...bytes.subarray(index, index + chunk));
      }
      return btoa(binary);
    }

    function parseHTML(html) {
      return new DOMParser().parseFromString(html, "text/html");
    }

    function hasDirectText(element) {
      return [...element.childNodes].some((node) => node.nodeType === Node.TEXT_NODE && node.textContent.trim());
    }

    function stamp(doc) {
      let count = 0;
      doc.body.querySelectorAll("*").forEach((element) => {
        if (element.closest("script, style, noscript")) return;
        const image = element.tagName === "IMG" && (element.getAttribute("src") || element.getAttribute("data-src"));
        const translated = element.hasAttribute("data-en");
        const text = hasDirectText(element);
        if (!image && !translated && !text) return;
        element.setAttribute("data-edit-id", String(++count));
      });
    }

    function setElementText(element, value) {
      const textNode = [...element.childNodes].find((node) => node.nodeType === Node.TEXT_NODE && node.textContent.trim());
      if (element.children.length && textNode) textNode.textContent = value;
      else element.textContent = value;
    }

    function visibleText(element, language) {
      if (!element.hasAttribute("data-en")) return element.textContent.trim();
      return element.getAttribute("data-" + language) || element.getAttribute("data-en") || "";
    }

    function pageBase(path) {
      return new URL("./", new URL(path, window.location.href)).href;
    }

    function previewDocument(page) {
      const preview = parseHTML("<!DOCTYPE html>\n" + page.doc.documentElement.outerHTML);
      const base = preview.createElement("base");
      base.href = page.base;
      base.setAttribute("data-editor-base", "1");
      preview.head.prepend(base);
      if (!page.full) {
        const link = preview.createElement("link");
        link.rel = "stylesheet";
        link.href = "style.css";
        preview.head.append(link);
      }
      const style = preview.createElement("style");
      style.setAttribute("data-editor-style", "1");
      style.textContent = EDITOR_CSS + (currentPath === "navbar.html" ? "" : `
        header.site-header { cursor: pointer; }
        header.site-header:hover { outline: 2px solid #2563eb; outline-offset: -2px; }
        header.site-header * { pointer-events: none; }
      `);
      preview.head.append(style);
      return "<!DOCTYPE html>\n" + preview.documentElement.outerHTML;
    }

    function exportPage(page) {
      const copy = parseHTML("<!DOCTYPE html>\n" + page.doc.documentElement.outerHTML);
      copy.querySelectorAll("[data-edit-id]").forEach((element) => element.removeAttribute("data-edit-id"));
      if (!page.full) return copy.body.innerHTML.trim() + "\n";
      return "<!DOCTYPE html>\n" + copy.documentElement.outerHTML + "\n";
    }

    function sourceElement(id) {
      const page = pages.get(currentPath);
      return page ? page.doc.querySelector('[data-edit-id="' + id + '"]') : null;
    }

    function frameElement(id) {
      const doc = $("preview").contentDocument;
      return doc ? doc.querySelector('[data-edit-id="' + id + '"]') : null;
    }

    function bindPreview() {
      const doc = $("preview").contentDocument;
      if (!doc || !doc.body || doc.documentElement.dataset.editorBound === "1") return;
      if (!doc.querySelector("[data-edit-id]")) return;
      doc.documentElement.dataset.editorBound = "1";
      doc.addEventListener("click", (event) => {
        if (currentPath !== "navbar.html") {
          const header = event.target.closest("header.site-header");
          if (header) {
            event.preventDefault();
            event.stopPropagation();
            selectNavbar(header);
            return;
          }
        }
        const link = event.target.closest("a[href]");
        if (link) {
          event.preventDefault();
          event.stopPropagation();
        }
        const element = event.target.closest("[data-edit-id]");
        if (!element) return;
        event.preventDefault();
        event.stopPropagation();
        selectElement(element.getAttribute("data-edit-id"));
      }, true);
      doc.addEventListener("submit", (event) => event.preventDefault(), true);
    }

    function showPreview(page) {
      const frame = $("preview");
      frame.onload = () => bindPreview();
      frame.srcdoc = previewDocument(page);
      let tries = 0;
      const watch = window.setInterval(() => {
        bindPreview();
        tries += 1;
        const doc = frame.contentDocument;
        if ((doc && doc.documentElement.dataset.editorBound === "1") || tries > 40) window.clearInterval(watch);
      }, 50);
    }

    async function readPage(path) {
      if (token) {
        const file = await api(path + "?ref=" + BRANCH);
        return { raw: decodeContent(file.content), sha: file.sha };
      }
      const response = await fetch(path, { cache: "no-store" });
      if (!response.ok) throw new Error(path + " 을 불러오지 못했습니다.");
      return { raw: await response.text(), sha: null };
    }

    async function loadPage(path) {
      currentPath = path;
      selectedId = "";
      clearEditor();
      if (!pages.has(path)) {
        setStatus(path + " 불러오는 중…");
        const loaded = await readPage(path);
        const doc = parseHTML(loaded.raw);
        stamp(doc);
        pages.set(path, {
          raw: loaded.raw,
          sha: loaded.sha,
          doc,
          full: /<html[\s>]/i.test(loaded.raw),
          dirty: false,
          base: pageBase(path)
        });
      }
      showPreview(pages.get(path));
      document.querySelectorAll("#pages button").forEach((button) => {
        button.classList.toggle("active", button.dataset.path === path);
      });
      refreshPublish();
      setStatus(token ? "GitHub main에서 불러왔습니다." : "이 사이트의 파일을 불러왔습니다. 저장하려면 토큰을 연결하세요.", "ok");
    }

    function refreshPublish() {
      const page = pages.get(currentPath);
      $("publish").disabled = !page || !page.dirty;
    }

    function clearEditor() {
      $("editorTitle").textContent = "요소를 클릭하세요";
      $("editorHint").hidden = false;
      $("editorMeta").textContent = "";
      $("fields").replaceChildren();
    }

    function field(label, value, onInput) {
      const wrap = document.createElement("label");
      wrap.textContent = label;
      const box = document.createElement(value.length > 80 ? "textarea" : "input");
      if (box.tagName === "INPUT") box.type = "text";
      box.value = value;
      box.addEventListener("input", () => onInput(box.value));
      wrap.append(box);
      return wrap;
    }

    function markDirty() {
      const page = pages.get(currentPath);
      if (!page) return;
      page.dirty = true;
      refreshPublish();
    }

    function syncText(source, frame) {
      const language = frame.ownerDocument.documentElement.lang || "en";
      if (source.hasAttribute("data-en")) {
        setElementText(source, source.getAttribute("data-en") || "");
        setElementText(frame, visibleText(source, language));
      }
    }

    function selectNavbar(header) {
      selectedId = "";
      const doc = header.ownerDocument;
      doc.querySelectorAll(".editor-selected").forEach((element) => element.classList.remove("editor-selected"));
      header.classList.add("editor-selected");
      $("editorHint").hidden = true;
      $("editorTitle").textContent = "메뉴";
      $("editorMeta").textContent = "메뉴 전체";
      const fields = $("fields");
      fields.replaceChildren();
      const note = document.createElement("p");
      note.className = "hint";
      note.textContent = "메뉴는 한 덩어리입니다. 다른 페이지로 가는 일은 위의 버튼이 합니다. 메뉴 글과 로고를 고치려면 아래에서 메뉴 편집으로 들어가세요.";
      const open = document.createElement("button");
      open.type = "button";
      open.className = "secondary";
      open.textContent = "메뉴 편집";
      open.addEventListener("click", () => {
        loadPage("navbar.html").catch((error) => setStatus(error.message, "error"));
      });
      fields.append(note, open);
    }

    function relativePath(fromFile, toFile) {
      const fromDir = fromFile.split("/").slice(0, -1);
      const toParts = toFile.split("/");
      let shared = 0;
      while (shared < fromDir.length && shared < toParts.length && fromDir[shared] === toParts[shared]) shared += 1;
      return "../".repeat(fromDir.length - shared) + toParts.slice(shared).join("/");
    }

    function encodeBytes(bytes) {
      let binary = "";
      const chunk = 0x8000;
      for (let index = 0; index < bytes.length; index += chunk) {
        binary += String.fromCharCode(...bytes.subarray(index, index + chunk));
      }
      return btoa(binary);
    }

    function fileToImage(file, maxEdge, quality) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        const url = URL.createObjectURL(file);
        image.onload = () => {
          const scale = Math.min(1, maxEdge / Math.max(image.width, image.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(image.width * scale));
          canvas.height = Math.max(1, Math.round(image.height * scale));
          canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);
          canvas.toBlob((blob) => {
            if (blob) {
              resolve({ blob, ext: "webp" });
              return;
            }
            canvas.toBlob((jpeg) => {
              if (!jpeg) reject(new Error("사진을 변환하지 못했습니다."));
              else resolve({ blob: jpeg, ext: "jpg" });
            }, "image/jpeg", quality);
          }, "image/webp", quality);
        };
        image.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("사진을 읽지 못했습니다."));
        };
        image.src = url;
      });
    }

    function imageSlot(frame) {
      const rect = frame.getBoundingClientRect();
      const css = Math.max(rect.width, rect.height, 1);
      const avatar = frame.classList.contains("members-av") || frame.classList.contains("team-photo");
      const hero = frame.classList.contains("hero-bg-slide") || css >= 720;
      const zoom = frame.closest(".gallery-grid, .photo-wall, .project-photos, .stop-photos, .zoomable");
      if (avatar || currentPath.startsWith("members/")) return { edge: 400, quality: 0.72, full: false };
      if (hero) return { edge: 1280, quality: 0.52, full: false };
      if (zoom) return { edge: 640, quality: 0.58, full: true };
      return { edge: Math.min(960, Math.max(480, Math.ceil(css * 2))), quality: 0.58, full: false };
    }

    async function putImage(blob, repoPath) {
      const bytes = new Uint8Array(await blob.arrayBuffer());
      await api(repoPath, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: "Add an image from the visual editor",
          content: encodeBytes(bytes),
          branch: BRANCH
        })
      });
    }

    async function uploadImage(file, frame) {
      token = $("token").value.trim();
      if (!token) throw new Error("사진을 올리려면 GitHub token을 먼저 연결하세요.");
      const slot = imageSlot(frame);
      const stem = file.name.replace(/\.[^.]+$/, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 32);
      const id = (stem || "photo") + "-" + Date.now().toString(36);
      const display = await fileToImage(file, slot.edge, slot.quality);
      const repoPath = "images/uploads/" + id + "." + display.ext;
      await putImage(display.blob, repoPath);
      const uploaded = { relative: relativePath(currentPath, repoPath), blob: display.blob, full: "" };
      if (slot.full) {
        const large = await fileToImage(file, 1400, 0.62);
        const fullPath = "images/uploads/" + id + "-full." + large.ext;
        await putImage(large.blob, fullPath);
        uploaded.full = relativePath(currentPath, fullPath);
      }
      return uploaded;
    }

    function selectElement(id) {
      selectedId = id;
      const source = sourceElement(id);
      const frame = frameElement(id);
      if (!source || !frame) return;
      const doc = frame.ownerDocument;
      doc.querySelectorAll(".editor-selected").forEach((element) => element.classList.remove("editor-selected"));
      frame.classList.add("editor-selected");
      frame.scrollIntoView({ block: "center", inline: "nearest" });

      const translated = source.hasAttribute("data-en");
      const image = source.tagName === "IMG";
      $("editorHint").hidden = true;
      $("editorTitle").textContent = image ? "사진" : "글";
      $("editorMeta").textContent = source.tagName.toLowerCase() + (translated ? " · 영어 / 한국어 / ລາວ" : "");
      const fields = $("fields");
      fields.replaceChildren();

      if (image) {
        const srcAttr = source.hasAttribute("src") ? "src" : "data-src";
        const pathField = field("사진 경로", source.getAttribute(srcAttr) || "", (value) => {
          source.setAttribute(srcAttr, value);
          frame.setAttribute(srcAttr, value);
          if (srcAttr === "data-src") frame.setAttribute("src", value);
          markDirty();
          const thumb = fields.querySelector(".thumb");
          if (thumb) thumb.src = frame.src;
        });
        fields.append(pathField);
        const upload = document.createElement("button");
        upload.type = "button";
        upload.className = "secondary";
        upload.textContent = "사진 올리기";
        const picker = document.createElement("input");
        picker.type = "file";
        picker.accept = "image/*";
        picker.hidden = true;
        upload.addEventListener("click", () => picker.click());
        picker.addEventListener("change", () => {
          const chosen = picker.files && picker.files[0];
          picker.value = "";
          if (!chosen) return;
          upload.disabled = true;
          setStatus("사진을 올리는 중…");
          uploadImage(chosen, frame).then((uploaded) => {
            const previewUrl = URL.createObjectURL(uploaded.blob);
            source.setAttribute(srcAttr, uploaded.relative);
            frame.setAttribute(srcAttr, uploaded.relative);
            if (uploaded.full) source.setAttribute("data-full", uploaded.full);
            frame.src = previewUrl;
            pathField.querySelector("input, textarea").value = uploaded.relative;
            const thumb = fields.querySelector(".thumb");
            if (thumb) thumb.src = previewUrl;
            markDirty();
            setStatus("사진을 화면 크기에 맞게 줄여 올렸습니다. 이 페이지 저장을 눌러야 글에 연결됩니다.", "ok");
          }).catch((error) => {
            setStatus(error.message, "error");
          }).finally(() => {
            upload.disabled = false;
          });
        });
        fields.append(upload, picker);
        fields.append(field("대체 텍스트", source.getAttribute("alt") || "", (value) => {
          source.setAttribute("alt", value);
          frame.setAttribute("alt", value);
          markDirty();
        }));
        if (srcAttr === "data-src") frame.setAttribute("src", source.getAttribute("data-src") || "");
        const thumb = document.createElement("img");
        thumb.className = "thumb";
        thumb.alt = "";
        thumb.src = frame.src;
        fields.append(thumb);
        return;
      }

      if (translated) {
        const write = () => {
          const inputs = fields.querySelectorAll("input, textarea");
          source.setAttribute("data-en", inputs[0].value);
          source.setAttribute("data-ko", inputs[1].value);
          source.setAttribute("data-lo", inputs[2].value);
          frame.setAttribute("data-en", inputs[0].value);
          frame.setAttribute("data-ko", inputs[1].value);
          frame.setAttribute("data-lo", inputs[2].value);
          syncText(source, frame);
          markDirty();
        };
        fields.append(field("영어", source.getAttribute("data-en") || "", write));
        fields.append(field("한국어", source.getAttribute("data-ko") || "", write));
        fields.append(field("ພາສາລາວ", source.getAttribute("data-lo") || "", write));
        return;
      }

      fields.append(field("내용", source.textContent.trim(), (value) => {
        setElementText(source, value);
        setElementText(frame, value);
        markDirty();
      }));
    }

    async function publish() {
      const page = pages.get(currentPath);
      if (!page || !page.dirty) return;
      token = $("token").value.trim();
      if (!token) {
        setStatus("저장하려면 GitHub token을 연결하세요.", "error");
        return;
      }
      $("publish").disabled = true;
      setStatus("GitHub에 저장하는 중…");
      try {
        if (!page.sha) {
          const latest = await api(currentPath + "?ref=" + BRANCH);
          page.sha = latest.sha;
        }
        const saved = await api(currentPath, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: "Update " + currentPath + " from the visual editor",
            content: encodeContent(exportPage(page)),
            sha: page.sha,
            branch: BRANCH
          })
        });
        page.sha = saved.content.sha;
        page.dirty = false;
        refreshPublish();
        setStatus("main에 저장했습니다. 사이트 반영까지 1–2분 걸립니다.", "ok");
      } catch (error) {
        setStatus(error.message, "error");
        refreshPublish();
      }
    }

    PAGES.forEach(([label, path]) => {
      const button = document.createElement("button");
      button.type = "button";
      button.dataset.path = path;
      button.textContent = label;
      button.addEventListener("click", () => {
        loadPage(path).catch((error) => setStatus(error.message, "error"));
      });
      $("pages").append(button);
    });

    document.querySelectorAll("[data-preview-lang]").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll("[data-preview-lang]").forEach((item) => {
          item.classList.toggle("active", item === button);
        });
        const win = $("preview").contentWindow;
        if (win && typeof win.setLanguage === "function") win.setLanguage(button.dataset.previewLang);
      });
    });
    document.querySelector("[data-preview-lang='en']").classList.add("active");

    $("preview").addEventListener("load", () => {
      const doc = $("preview").contentDocument;
      if (!doc) return;
      const url = doc.URL || "";
      if (url.startsWith("about:")) return;
      const page = pages.get(currentPath);
      if (page) showPreview(page);
    });
    $("connect").addEventListener("click", () => {
      if ([...pages.values()].some((page) => page.dirty) && !confirm("저장하지 않은 수정이 있습니다. 다시 불러올까요?")) return;
      token = $("token").value.trim();
      pages.clear();
      if (!token) {
        setStatus("토큰을 지웠습니다. 이 사이트의 파일을 보여 줍니다.");
        loadPage(currentPath).catch((error) => setStatus(error.message, "error"));
        return;
      }
      setStatus("GitHub에 연결하는 중…");
      api("index.html?ref=" + BRANCH)
        .then(() => loadPage(currentPath))
        .catch((error) => setStatus(error.message, "error"));
    });
    $("publish").addEventListener("click", publish);
    window.addEventListener("beforeunload", (event) => {
      if ([...pages.values()].some((page) => page.dirty)) {
        event.preventDefault();
        event.returnValue = "";
      }
    });

    loadPage(currentPath).catch((error) => setStatus(error.message, "error"));
  </script>
</body>
</html>
